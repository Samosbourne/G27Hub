<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E14">
<title>G27 Hub</title>
<style>
  :root { --bg:#0B0E14; --panel:#141923; --card:#1B2230; --line:#232B3A; --text:#F1F5F9; --dim:#94A3B8; --faint:#64748B;
          --accent:#00D2FF; --accentdim:#162436; --ok:#10B981; --warn:#F59E0B; --err:#EF4444; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 "Segoe UI", system-ui, sans-serif;
         padding:16px 16px calc(16px + env(safe-area-inset-bottom)); max-width:560px; margin-inline:auto; }
  header { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  header b { font-size:18px; }
  #dot { width:9px; height:9px; border-radius:50%; background:var(--err); }
  #dot.on { background:var(--ok); }
  #game { margin-left:auto; color:var(--dim); font-size:13px; text-align:right; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
  .label { font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--faint); text-transform:uppercase; margin-bottom:8px; }
  #leds { display:flex; justify-content:center; gap:10px; margin-bottom:14px; }
  #leds i { width:15%; max-width:56px; height:22px; border-radius:11px; opacity:.15; transition:opacity 40ms; }
  #leds i.on { opacity:1; }
  .dash { display:grid; grid-template-columns:1fr auto 1fr; align-items:end; text-align:center; }
  #gear { font-size:96px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; }
  .big { font-size:28px; font-weight:600; font-variant-numeric:tabular-nums; }
  .unit { font-size:12px; color:var(--dim); }
  #rpmbar { height:6px; background:var(--accentdim); border-radius:3px; margin-top:14px; overflow:hidden; }
  #rpmbar div { height:100%; width:0; background:var(--accent); }
  select, button { font:inherit; color:var(--text); background:var(--card); border:1px solid #2E3A4F; border-radius:8px; }
  select { width:100%; padding:12px; }
  .row { display:flex; gap:8px; }
  .row button { flex:1; padding:12px 0; font-weight:600; }
  .row button.sel { background:var(--accentdim); border-color:var(--accent); color:var(--accent); }
  .slider { display:flex; align-items:center; gap:12px; }
  input[type=range] { flex:1; accent-color:var(--accent); height:32px; }
  #gainv { min-width:48px; text-align:right; color:var(--accent); font-weight:600; }
  #off { display:none; text-align:center; color:var(--warn); margin:8px 0 12px; }
  footer { color:var(--faint); font-size:12px; text-align:center; margin-top:8px; }
</style>
</head>
<body>
<header><span id="dot"></span><b>G27 Hub</b><span id="game"></span></header>
<div id="off"></div>

<div class="card">
  <div id="leds"><i style="background:#35E06B"></i><i style="background:#35E06B"></i><i style="background:#FFC531"></i><i style="background:#FF8A1F"></i><i style="background:#FF3B3B"></i></div>
  <div class="dash">
    <div><div class="big" id="speed">—</div><div class="unit">km/h</div></div>
    <div id="gear">N</div>
    <div><div class="big" id="rpm">—</div><div class="unit">RPM</div></div>
  </div>
  <div id="rpmbar"><div></div></div>
</div>

<div class="card">
  <div class="label" data-t="profile"></div>
  <select id="profile"></select>
</div>

<div class="card">
  <div class="label" data-t="rotation"></div>
  <div class="row" id="ranges"></div>
</div>

<div class="card">
  <div class="label" data-t="gain"></div>
  <div class="slider"><input type="range" id="gain" min="0" max="100" step="5"><span id="gainv"></span></div>
</div>

<footer data-t="foot"></footer>

<script>
const TXT = {
  pt: { profile:"Perfil", rotation:"Rotação", gain:"Intensidade do force feedback", foot:"Mesma rede Wi-Fi do PC · os ajustes valem na hora",
        none:"sem jogo", nowheel:"G27 desconectado", lost:"Sem conexão com o PC. Tentando de novo…" },
  en: { profile:"Profile", rotation:"Rotation", gain:"Force feedback strength", foot:"Same Wi-Fi network as the PC · changes apply right away",
        none:"no game", nowheel:"G27 disconnected", lost:"Lost connection to the PC. Retrying…" }
};
const key = new URLSearchParams(location.search).get("k") || "";
const $ = id => document.getElementById(id);
let lang = "pt", dragging = false, rangesShown = "", profilesShown = "";

function t(k) { return (TXT[lang] || TXT.pt)[k]; }
function texts() { document.querySelectorAll("[data-t]").forEach(e => e.textContent = t(e.dataset.t)); }
function cmd(what, v) { fetch(`/cmd?k=${encodeURIComponent(key)}&do=${what}&v=${encodeURIComponent(v)}`, { method:"POST" }); }

function show(s) {
  if (s.lang !== lang) { lang = s.lang; document.documentElement.lang = lang; texts(); }
  $("dot").className = s.connected ? "on" : "";
  $("game").textContent = s.game || t("none");
  $("off").style.display = s.connected ? "none" : "block";
  $("off").textContent = t("nowheel");
  [...$("leds").children].forEach((e, i) => e.classList.toggle("on", (s.leds >> i & 1) === 1));
  $("gear").textContent = s.gear == null ? "–" : s.gear < 0 ? "R" : s.gear === 0 ? "N" : s.gear;
  $("rpm").textContent = s.rpm ? Math.round(s.rpm) : "—";
  $("speed").textContent = s.speed != null ? Math.round(s.speed) : "—";
  $("rpmbar").firstChild.style.width = s.maxRpm > 0 ? Math.min(100, s.rpm / s.maxRpm * 100) + "%" : "0";

  const pk = JSON.stringify(s.profiles);
  if (pk !== profilesShown) {
    profilesShown = pk;
    $("profile").innerHTML = "";
    s.profiles.forEach(p => $("profile").add(new Option(p.name, p.id)));
  }
  $("profile").value = s.activeId;

  if (s.ranges.join() !== rangesShown) {
    rangesShown = s.ranges.join();
    $("ranges").innerHTML = "";
    s.ranges.forEach(r => { const b = document.createElement("button"); b.textContent = r + "°"; b.dataset.r = r; b.onclick = () => cmd("range", r); $("ranges").append(b); });
  }
  [...$("ranges").children].forEach(b => b.classList.toggle("sel", +b.dataset.r === s.range));

  if (!dragging) { $("gain").value = s.gain; $("gainv").textContent = s.gain + "%"; }
}

$("profile").onchange = e => cmd("profile", e.target.value);
$("gain").oninput = e => { dragging = true; $("gainv").textContent = e.target.value + "%"; };
$("gain").onchange = e => { cmd("gain", e.target.value); setTimeout(() => dragging = false, 600); };

function connect() {
  const es = new EventSource(`/events?k=${encodeURIComponent(key)}`);
  es.onmessage = e => show(JSON.parse(e.data));
  es.onerror = () => { $("dot").className = ""; $("off").style.display = "block"; $("off").textContent = t("lost"); };
}
texts();
connect();
</script>
</body>
</html>
